[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lexproof"
version = "0.1.0"
description = "Preservação técnica de evidências digitais"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10,<4"
authors = [
    { name = "LexProof Team" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Legal Industry",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
    "PySide6>=6.6.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "blake3>=1.0.0",
    "Pillow>=10.0.0",
    "numpy>=1.24.0",
    "reportlab>=4.0.0",
    "jinja2>=3.1.0",
    "qrcode>=7.4.0",
    "exifread>=3.0.0",
    "pytesseract>=0.3.10",
    "PyPDF2>=3.0.0",
    "easyocr>=1.7.0",
    "tzdata>=2024.1",
    "dkimpy>=1.1",
    "dnspython>=2.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-qt>=4.2.0",
    "ruff>=0.1.0",
    "black>=23.0.0",
    "mypy>=1.7.0",
    "pre-commit>=3.6.0",
]
blockchain = [
    "opentimestamps>=0.4.0",
]

[project.scripts]
lexproof = "lexproof.__main__:main"

[project.gui-scripts]
lexproof-gui = "lexproof.__main__:main"

[tool.ruff]
target-version = "py310"
line-length = 100
select = ["E", "F", "W", "I", "N", "UP", "S", "B", "A", "C4", "SIM", "TCH"]
ignore = ["E501"]

[tool.ruff.isort]
known-first-party = ["lexproof"]

[tool.black]
target-version = ["py310"]
line-length = 100

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "slow: marks tests as slow",
    "integration: marks integration tests",
    "ui: marks UI tests",
    "network: acessa servicos externos (TSA)",
]

[tool.hatch.build.targets.wheel]
packages = ["lexproof"]
